name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: JavaBank
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Testes e jar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test jar

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: docker build -t javabank:ci .

      - name: Subir o container e testar o health check
        run: |
          docker run -d --name javabank -p 8080:8080 javabank:ci
          for i in $(seq 1 20); do
            curl -fs http://localhost:8080/api/health && exit 0
            sleep 2
          done
          docker logs javabank
          exit 1
